// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.3.20'

    repositories {
        jcenter()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:3.3.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.github.triplet.gradle:play-publisher:2.0.0-beta2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        jcenter()
        mavenCentral()
        maven {
            url "https://oss.sonatype.org/content/repositories/snapshots/"
        }
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/jfenn/*")
            credentials {
                username = System.getenv("GITHUB_ACTOR") ?: "github"
                password = System.getenv("GITHUB_TOKEN") ?: System.getenv("GITHUB_TOKEN_PUB") ?: ""
            }
        }
        maven {
            url "https://jitpack.io"
            credentials { auth(HttpHeaderCredentials.class) {
                name = "Authorization"
                value = "token " + (System.getenv("GITHUB_TOKEN") ?: System.getenv("GITHUB_TOKEN_PUB") ?: "")
            }}
        }
        google()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
